name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libssl-dev

      - name: Build API
        run: |
          if [[ ! -f httplib.h ]]; then bash scripts/fetch_deps.sh || true; fi
          gcc -O2 -c sqlite3.c -o sqlite3.o -DSQLITE_THREADSAFE=1
          g++ -std=c++17 -O2 -pthread server.cpp sqlite3.o -o server -lssl -lcrypto -ldl

      - name: Start API
        run: |
          ./server > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/health && break
            sleep 0.3
          done

      - name: Smoke tests
        run: bash scripts/test_api.sh

      - name: Stop API
        if: always()
        run: kill $(cat /tmp/api.pid) 2>/dev/null || true
