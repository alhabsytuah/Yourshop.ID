# Local / staging without Let's Encrypt (self-signed or HTTP-only)
# sudo cp nginx/yourshop.local.conf /etc/nginx/sites-available/yourshop-local
# Domain: localhost

upstream yourshop_api_local {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    root /var/www/yourshop;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://yourshop_api_local;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
