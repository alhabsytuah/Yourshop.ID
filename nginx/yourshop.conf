# YourShop.Id — nginx reverse proxy
# Install: sudo cp nginx/yourshop.conf /etc/nginx/sites-available/yourshop
#          sudo ln -sf /etc/nginx/sites-available/yourshop /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Upstream: C++ API on 127.0.0.1:8080 (HTTP internal)
# TLS: Let's Encrypt via certbot (see scripts/setup_letsencrypt.sh)

upstream yourshop_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Rate limiting zones (nginx layer — tambahan di atas Redis app-level)
limit_req_zone $binary_remote_addr zone=ysi_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ysi_api:10m rate=60r/m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourshop.example.com;   # ← ganti domain Anda

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourshop.example.com;   # ← ganti domain Anda

    # --- TLS (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/yourshop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourshop.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yourshop.example.com/chain.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Mozilla intermediate
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (enable after cert verified)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Logs
    access_log /var/log/nginx/yourshop.access.log;
    error_log  /var/log/nginx/yourshop.error.log;

    client_max_body_size 5m;

    # --- Static frontend ---
    root /var/www/yourshop;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- API reverse proxy ---
    location /api/ {
        limit_req zone=ysi_api burst=30 nodelay;

        # Stricter on auth endpoints
        location /api/auth/login {
            limit_req zone=ysi_login burst=5 nodelay;
            proxy_pass http://yourshop_api;
            include /etc/nginx/snippets/yourshop-proxy.conf;
        }
        location /api/auth/register {
            limit_req zone=ysi_login burst=3 nodelay;
            proxy_pass http://yourshop_api;
            include /etc/nginx/snippets/yourshop-proxy.conf;
        }
        location /api/auth/forgot {
            limit_req zone=ysi_login burst=3 nodelay;
            proxy_pass http://yourshop_api;
            include /etc/nginx/snippets/yourshop-proxy.conf;
        }

        proxy_pass http://yourshop_api;
        include /etc/nginx/snippets/yourshop-proxy.conf;
    }

    # Health (optional public)
    location = /api/health {
        proxy_pass http://yourshop_api;
        include /etc/nginx/snippets/yourshop-proxy.conf;
        access_log off;
    }
}
